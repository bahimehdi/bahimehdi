name: Refresh contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build contribution graph
        run: python scripts/build_contributions.py
      - name: Commit updated graph
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "Refresh contribution graph"
          git push
